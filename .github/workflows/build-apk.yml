name: Build & Auto-Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore clean MainActivity from commit da2d1b2
        run: |
          git checkout da2d1b2 -- app/src/main/java/com/example/MainActivity.kt

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate debug.keystore if missing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Add missing default_web_client_id
        run: |
          mkdir -p app/src/main/res/values
          cat << 'EOF' > app/src/main/res/values/ci_strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="default_web_client_id">placeholder_client_id</string>
          </resources>
          EOF

      - name: Add Splash Screen & AutoUpdateChecker safely
        run: |
          cat << 'EOF' > app/src/main/java/com/example/SplashAndUpdate.kt
          package com.example

          import android.content.Intent
          import android.net.Uri
          import androidx.compose.animation.AnimatedVisibility
          import androidx.compose.animation.core.FastOutSlowInEasing
          import androidx.compose.animation.core.animateFloatAsState
          import androidx.compose.animation.core.tween
          import androidx.compose.animation.fadeIn
          import androidx.compose.animation.fadeOut
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.SportsCricket
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.runtime.saveable.rememberSaveable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.alpha
          import androidx.compose.ui.draw.scale
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.withContext
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          @Composable
          fun SplashAndUpdateHost(content: @Composable () -> Unit) {
              var showSplash by rememberSaveable { mutableStateOf(true) }
              var startAnim by remember { mutableStateOf(false) }

              LaunchedEffect(Unit) {
                  startAnim = true
                  if (showSplash) {
                      delay(3000L)
                      showSplash = false
                  }
              }

              val scale by animateFloatAsState(
                  targetValue = if (startAnim) 1f else 0.7f,
                  animationSpec = tween(durationMillis = 900, easing = FastOutSlowInEasing),
                  label = "scale"
              )
              val alpha by animateFloatAsState(
                  targetValue = if (startAnim) 1f else 0f,
                  animationSpec = tween(durationMillis = 900),
                  label = "alpha"
              )

              Box(modifier = Modifier.fillMaxSize()) {
                  if (!showSplash) {
                      AutoUpdateChecker()
                      content()
                  }

                  AnimatedVisibility(
                      visible = showSplash,
                      enter = fadeIn(tween(400)),
                      exit = fadeOut(tween(600))
                  ) {
                      Box(
                          modifier = Modifier
                              .fillMaxSize()
                              .background(
                                  Brush.verticalGradient(
                                      listOf(
                                          MaterialTheme.colorScheme.primaryContainer.copy(alpha = 0.35f),
                                          MaterialTheme.colorScheme.background,
                                          MaterialTheme.colorScheme.background
                                      )
                                  )
                              ),
                          contentAlignment = Alignment.Center
                      ) {
                          Column(
                              horizontalAlignment = Alignment.CenterHorizontally,
                              modifier = Modifier.scale(scale).alpha(alpha)
                          ) {
                              Surface(
                                  shape = CircleShape,
                                  color = MaterialTheme.colorScheme.primary.copy(alpha = 0.14f),
                                  modifier = Modifier.size(116.dp)
                              ) {
                                  Box(contentAlignment = Alignment.Center) {
                                      Icon(
                                          imageVector = Icons.Filled.SportsCricket,
                                          contentDescription = "Logo",
                                          tint = MaterialTheme.colorScheme.primary,
                                          modifier = Modifier.size(64.dp)
                                      )
                                  }
                              }
                              Spacer(modifier = Modifier.height(20.dp))
                              Text(
                                  text = "Cricscore",
                                  style = MaterialTheme.typography.headlineLarge,
                                  fontWeight = FontWeight.ExtraBold,
                                  letterSpacing = 1.sp
                              )
                              Spacer(modifier = Modifier.height(6.dp))
                              Text(
                                  text = "Live Cricket Scoring & Broadcast",
                                  style = MaterialTheme.typography.bodyMedium,
                                  color = MaterialTheme.colorScheme.onSurfaceVariant
                              )
                          }
                          Text(
                              text = "Made by Chandu Pritam",
                              style = MaterialTheme.typography.titleMedium,
                              fontWeight = FontWeight.Bold,
                              color = MaterialTheme.colorScheme.primary,
                              modifier = Modifier
                                  .align(Alignment.BottomCenter)
                                  .padding(bottom = 48.dp)
                                  .alpha(alpha)
                          )
                      }
                  }
              }
          }

          @Composable
          fun AutoUpdateChecker() {
              val context = LocalContext.current
              var latestVersion by remember { mutableStateOf<String?>(null) }
              var downloadUrl by remember { mutableStateOf<String?>(null) }
              var showDialog by remember { mutableStateOf(false) }

              val currentVersion = remember {
                  try {
                      context.packageManager.getPackageInfo(context.packageName, 0).versionName ?: ""
                  } catch (e: Exception) { "" }
              }

              LaunchedEffect(Unit) {
                  withContext(Dispatchers.IO) {
                      try {
                          val url = URL("https://github.com")
                          val conn = (url.openConnection() as HttpURLConnection).apply {
                              requestMethod = "GET"
                              setRequestProperty("Accept", "application/vnd.github+json")
                              connectTimeout = 5000
                              readTimeout = 5000
                          }
                          if (conn.responseCode == 200) {
                              val response = conn.inputStream.bufferedReader().use { it.readText() }
                              val json = JSONObject(response)
                              val tag = json.optString("tag_name", "")
                              val assets = json.optJSONArray("assets")
                              val apkUrl = if (assets != null && assets.length() > 0) {
                                  assets.getJSONObject(0).optString("browser_download_url", "")
                              } else {
                                  "https://github.com"
                              }
                              if (tag.isNotEmpty() && currentVersion.isNotEmpty() && tag != currentVersion) {
                                  latestVersion = tag
                                  downloadUrl = apkUrl
                                  showDialog = true
                              }
                          }
                      } catch (_: Exception) {}
                  }
              }

              if (showDialog && latestVersion != null && downloadUrl != null) {
                  AlertDialog(
                      onDismissRequest = { showDialog = false },
                      
