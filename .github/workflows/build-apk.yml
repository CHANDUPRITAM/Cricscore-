name: Build & Auto-Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate debug.keystore if missing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Add missing default_web_client_id
        run: |
          mkdir -p app/src/main/res/values
          cat << 'EOF' > app/src/main/res/values/ci_strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="default_web_client_id">placeholder_client_id</string>
          </resources>
          EOF

      - name: Inject In-App AutoUpdateChecker automatically
        run: |
          MAIN_FILE="app/src/main/java/com/example/MainActivity.kt"
          cat << 'EOF' > app/src/main/java/com/example/UpdateChecker.kt
          package com.example

          import android.content.Intent
          import android.net.Uri
          import androidx.compose.material3.AlertDialog
          import androidx.compose.material3.Button
          import androidx.compose.material3.Text
          import androidx.compose.material3.TextButton
          import androidx.compose.runtime.*
          import androidx.compose.ui.platform.LocalContext
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          @Composable
          fun AutoUpdateChecker() {
              val context = LocalContext.current
              var latestVersion by remember { mutableStateOf<String?>(null) }
              var downloadUrl by remember { mutableStateOf<String?>(null) }
              var showDialog by remember { mutableStateOf(false) }

              val currentVersion = remember {
                  try {
                      context.packageManager.getPackageInfo(context.packageName, 0).versionName ?: ""
                  } catch (e: Exception) { "" }
              }

              LaunchedEffect(Unit) {
                  withContext(Dispatchers.IO) {
                      try {
                          val url = URL("https://github.com")
                          val conn = (url.openConnection() as HttpURLConnection).apply {
                              requestMethod = "GET"
                              setRequestProperty("Accept", "application/vnd.github+json")
                              connectTimeout = 5000
                              readTimeout = 5000
                          }
                          if (conn.responseCode == 200) {
                              val response = conn.inputStream.bufferedReader().use { it.readText() }
                              val json = JSONObject(response)
                              val tag = json.optString("tag_name", "")
                              val assets = json.optJSONArray("assets")
                              val apkUrl = if (assets != null && assets.length() > 0) {
                                  assets.getJSONObject(0).optString("browser_download_url", "")
                              } else {
                                  "https://github.com"
                              }
                              if (tag.isNotEmpty() && currentVersion.isNotEmpty() && tag != currentVersion) {
                                  latestVersion = tag
                                  downloadUrl = apkUrl
                                  showDialog = true
                              }
                          }
                      } catch (_: Exception) {}
                  }
              }

              if (showDialog && latestVersion != null && downloadUrl != null) {
                  AlertDialog(
                      onDismissRequest = { showDialog = false },
                      title = { Text("नया अपडेट उपलब्ध है! 🚀") },
                      text = { Text("ऐप का नया वर्ज़न ($latestVersion) आ गया है। नए फीचर्स पाने के लिए अभी अपडेट करें।") },
                      confirmButton = {
                          Button(onClick = {
                              showDialog = false
                              context.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(downloadUrl)))
                          }) { Text("Update Now") }
                      },
                      dismissButton = {
                          TextButton(onClick = { showDialog = false }) { Text("बाद में") }
                      }
                  )
              }
          }
          EOF

          if ! grep -q "AutoUpdateChecker()" "$MAIN_FILE"; then
              sed -i 's/CricscoreTheme(themeMode = preferences.themeMode) {/CricscoreTheme(themeMode = preferences.themeMode) {\n                AutoUpdateChecker()/' "$MAIN_FILE"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Set App Version & Build APK
        run: |
          sed -i 's/versionName = ".*"/versionName = "v1.0.${{ github.run_number }}"/' app/build.gradle.kts
          sed -i 's/versionCode = [0-9]*/versionCode = ${{ github.run_number }}/' app/build.gradle.kts
          gradle assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Cricscore.apk

      - name: Auto Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Cricscore v1.0.${{ github.run_number }}
          files: Cricscore.apk
          
